# Test-only config for tests/test_e2e_tls_resumption.py.
#
# idle_timeout_s=0 closes a connection once it has no outstanding queries, so
# each query batch handshakes anew -- which is what gives later batches a
# ticket to resume with.
[traffic]

[traffic.DOH]
protocol = "doh"
idle_timeout_s = 0
# 128 matches dnsjit's pacing batch, so one batch is dispatched as one chunk
# (see conn_reuse_idle0_doh.toml).
batch_size = 128

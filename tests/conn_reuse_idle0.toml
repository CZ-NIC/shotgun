# Test-only config for tests/test_e2e_conn_reuse.py.
#
# idle_timeout_s=0: a connection closes as soon as it has no outstanding
# (queued or in-flight) queries -- not "one query per connection". A query
# sent while a prior one on the same conn is still in flight still pipelines
# onto it (connection.c's dispatch reuses any ACTIVE conn regardless of
# idle_timeout_s; only _output_dnssim_conn_idle()'s close-when-truly-idle
# check is affected by this setting).
[traffic]

[traffic.TCP]
protocol = "tcp"
idle_timeout_s = 0
